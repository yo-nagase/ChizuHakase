name: ChizuHakase

options:
  bundleIdPrefix: com.wakuwaku
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # 日本語のみのアプリ(CLAUDE.md §1)。既定の en のままだと、UIKit が出す
  # システム文言 — NavigationStack の戻るボタン等 — が日本の端末でも
  # 「Back」と英語で描かれる。
  developmentLanguage: ja

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Everything in this app is UI-driven and touches @Observable state, so
    # MainActor-by-default removes a pile of isolation noise. The few genuinely
    # concurrent spots (file IO, speech recognition) opt out explicitly.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "YES"
    # .xcodeproj は生成物(.gitignore 済み)なので、GUI で選んだ Team は
    # xcodegen generate のたびに消える。ここが唯一の永続化先。
    DEVELOPMENT_TEAM: R4PM3WY76A
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GCC_WARN_ABOUT_RETURN_TYPE: "YES_ERROR"

targets:
  ChizuHakase:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChizuHakase
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.wakuwaku.chizuhakase
        # Executable/bundle name stays ASCII (TEST_HOST and codesign paths
        # depend on it); the Japanese name users see is the display name.
        PRODUCT_NAME: ChizuHakase
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Five characters: 「めざせ!ちずはかせ」 truncates under a home-screen
        # icon, and a name that ends in … is not a name a child can read.
        INFOPLIST_KEY_CFBundleDisplayName: ちずはかせ
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIStatusBarHidden: "YES"
        # iPhone stays portrait: the map layout and the reachability of tap
        # targets are tuned for one aspect ratio, and children hold a phone fixed.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPad takes all four, which is not a preference — an iPad app that
        # declares fewer fails App Store validation ("iPad multitasking support
        # requires all four orientations"), and the escape hatch that used to
        # buy an exemption, UIRequiresFullScreen, is deprecated in iPadOS 26 and
        # already warns that it will be ignored. Landscape is therefore a state
        # the layout has to survive rather than one it can refuse.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Speech recognition is an optional mode (CLAUDE.md §7). Both strings
        # must exist or the app crashes the moment the mode is offered.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: こえで こたえるモードで つかいます。こえは この iPhone の なかだけで しらべます。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: こえで こたえるモードで つかいます。こえは この iPhone の なかだけで しらべます。

  ChizuHakaseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChizuHakaseTests
    dependencies:
      - target: ChizuHakase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakuwaku.chizuhakase.tests
        GENERATE_INFOPLIST_FILE: "YES"

  ChizuHakaseUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChizuHakaseUITests
    dependencies:
      - target: ChizuHakase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakuwaku.chizuhakase.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        # XCTestCase's overrides are nonisolated, so the app target's
        # MainActor-by-default does not apply here.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  ChizuHakase:
    build:
      targets:
        ChizuHakase: all
        ChizuHakaseTests: [test]
        ChizuHakaseUITests: [test]
    test:
      targets:
        - ChizuHakaseTests
        - ChizuHakaseUITests
      gatherCoverageData: true
    run:
      config: Debug
