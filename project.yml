name: WakuwakuChizu

options:
  bundleIdPrefix: com.wakuwaku
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Everything in this app is UI-driven and touches @Observable state, so
    # MainActor-by-default removes a pile of isolation noise. The few genuinely
    # concurrent spots (file IO, speech recognition) opt out explicitly.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "YES"
    # .xcodeproj は生成物(.gitignore 済み)なので、GUI で選んだ Team は
    # xcodegen generate のたびに消える。ここが唯一の永続化先。
    DEVELOPMENT_TEAM: R4PM3WY76A
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GCC_WARN_ABOUT_RETURN_TYPE: "YES_ERROR"

targets:
  WakuwakuChizu:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WakuwakuChizu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.wakuwaku.chizu
        # Executable/bundle name stays ASCII (TEST_HOST and codesign paths
        # depend on it); the Japanese name users see is the display name.
        PRODUCT_NAME: WakuwakuChizu
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: わくわくちず
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIStatusBarHidden: "YES"
        # Portrait only: the map layout and the reachability of tap targets are
        # tuned for one aspect ratio, and children hold the device fixed.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Speech recognition is an optional mode (CLAUDE.md §7). Both strings
        # must exist or the app crashes the moment the mode is offered.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: こえで こたえるモードで つかいます。こえは この iPhone の なかだけで しらべます。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: こえで こたえるモードで つかいます。こえは この iPhone の なかだけで しらべます。

  WakuwakuChizuTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WakuwakuChizuTests
    dependencies:
      - target: WakuwakuChizu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakuwaku.chizu.tests
        GENERATE_INFOPLIST_FILE: "YES"

  WakuwakuChizuUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WakuwakuChizuUITests
    dependencies:
      - target: WakuwakuChizu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakuwaku.chizu.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        # XCTestCase's overrides are nonisolated, so the app target's
        # MainActor-by-default does not apply here.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  WakuwakuChizu:
    build:
      targets:
        WakuwakuChizu: all
        WakuwakuChizuTests: [test]
        WakuwakuChizuUITests: [test]
    test:
      targets:
        - WakuwakuChizuTests
        - WakuwakuChizuUITests
      gatherCoverageData: true
    run:
      config: Debug
